name: Deploy IngestX

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File deploy\update.ps1
