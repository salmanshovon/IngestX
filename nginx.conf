worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Media/recording uploads can be large.
    client_max_body_size 1024m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    # WebSocket upgrade (Django Channels).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ingestx_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;   # change to your domain / server IP if needed

        # React (Vite) build output.
        root   D:/Program/IngestX/frontend/dist;
        index  index.html;

        # Django admin. ADMIN_URL=4dm1n/ in backend/.env.
        location /4dm1n/ {
            proxy_pass http://ingestx_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect off;
        }

        location = /4dm1n {
            return 301 /4dm1n/;
        }

        # Django static files (collectstatic output).
        location /static/ {
            alias D:/Program/IngestX/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # User uploads (MEDIA_ROOT).
        location /media/ {
            alias D:/Program/IngestX/backend/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # Django REST API.
        location /api/ {
            proxy_pass http://ingestx_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }

        # Django Channels realtime socket: /ws/realtime/.
        location /ws/ {
            proxy_pass http://ingestx_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vite emits content-hashed filenames here, so they can be cached forever.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Never cache the SPA shell.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Lightweight health probes for monitors and the process supervisor.
        location /healthz {
            proxy_pass http://ingestx_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # SPA fallback: React Router owns /login, /schedule, /admin, etc.
        # NOTE: /admin is a frontend route -- Django admin lives at /4dm1n/.
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
            internal;
        }
    }
}
